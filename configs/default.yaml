# AMT 変速品質 解析パイプライン設定
output_dir: outputs

dataset:
  n_samples: 600      # ランダム DoE で生成する変速イベント数
  seed: 0
  n_jobs: -1

model:
  # 代理モデルを作る KPI。primary_target は感度解析(重要度/PDP)の対象
  targets: [shift_time_s, speed_drop_kmh, speed_loss_kmh, jerk_rms]
  primary_target: shift_time_s
  n_trials: 40        # Optuna によるハイパーパラメータ探索回数
  n_splits: 5
  model_names: [hist_gbr, random_forest, extra_trees, ridge]
  permutation_repeats: 10

calibration:
  n_trials: 150       # Optuna による適合値探索回数
  mode: pareto        # scalar | pareto (NSGA-II)
  seed: 0
  use_surrogate: false  # true にすると代理モデルで高速探索
  worst_case_weight: 0.3
  # 目的 KPI(多目的モードでは並び順が軸の順序)。
  #   shift_time_s   : 変速時間
  #   speed_loss_kmh : 変速による車速損失(変速しなかった場合との差)
  #   jerk_rms       : 変速ショック(速さを追い過ぎないための抑え役)
  # 実測の落ち込み幅 speed_drop_kmh は記述指標として全ての表・図に併記される
  # (全開アップシフトで恒等的に 0 になり目的関数に向かないため)。
  objectives: [shift_time_s, speed_loss_kmh, jerk_rms]
  weights:
    shift_time_s: 0.40
    speed_loss_kmh: 0.40
    jerk_rms: 0.20

ollama:
  enabled: true
  host: http://localhost:11434
  model: qwen2.5:7b
  temperature: 0.3
  timeout_s: 180
  language: ja
